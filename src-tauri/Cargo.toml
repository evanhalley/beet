[package]
name = "beet"
version = "0.1.0"
description = "Beet — a glanceable GitHub dashboard."
authors = ["Evan Halley"]
license = "MIT"
repository = "https://github.com/evanhalley/beet"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "beet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
# fancy-regex supports JS-compatible features (lookaround, backreferences)
# the basic `regex` crate rejects. Used only for the user-supplied taskRegex
# so saved patterns from the JS era keep working.
fancy-regex = "0.14"
thiserror = "1"
starship-battery = "0.10"

[dev-dependencies]
wiremock = "0.6"
