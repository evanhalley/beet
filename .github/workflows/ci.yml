name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # dtolnay/rust-toolchain only appends ~/.cargo/bin to PATH when it has
      # to bootstrap rustup itself. On runner images that already ship a
      # rustup shim, `cargo` is "found" so that PATH update is skipped — and
      # subsequent steps resolve `cargo` to the rustup-init shim instead of
      # the stable toolchain it just installed. Add it explicitly.
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # tauri-plugin-notifications compiles its Swift half into the
          # crate's *source* dir (~/.cargo/registry/src/**/macos/.build) and
          # bundles that static lib into its rlib. rust-cache drops
          # registry/src by default, so a partial restore after a lockfile
          # change (which recompiles the plugin but reuses its cached
          # build-script output) fails with "could not find native static
          # library". Keep the extracted sources alongside the build.
          cache-directories: ~/.cargo/registry/src
          # Bumped once so caches built before registry/src was kept are
          # not restored.
          prefix-key: v1-rust

      - run: npm ci

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
