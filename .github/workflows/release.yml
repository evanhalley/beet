name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which semver component to bump"
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write   # required to create releases and push tags

    steps:
      # ── Guard: only release from main ────────────────────────────────
      # workflow_dispatch can be triggered from any ref. The release tag
      # must point at main, so fail fast on anything else.
      - name: Ensure dispatched from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release workflow must be dispatched from main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4
        # Full history + tags so the latest release tag can be found.
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # ── Bump version from the latest release tag ──────────────────────
      # main is protected by a "changes must be made through a pull
      # request" ruleset, so the version bump is never committed back.
      # The latest vX.Y.Z tag is the source of truth; tauri.conf.json is
      # only patched inside this build. Falls back to tauri.conf.json when
      # no release tag exists yet.
      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -n "$LATEST_TAG" ]; then
            CURRENT="${LATEST_TAG#v}"
          else
            CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "Bumping ${CURRENT} → ${VERSION} (${{ inputs.bump }})"

      # ── Patch tauri.conf.json ─────────────────────────────────────────
      - name: Patch version in tauri.conf.json
        run: |
          jq --arg v "${{ steps.version.outputs.VERSION }}" \
             '.version = $v' src-tauri/tauri.conf.json > _tmp.json
          mv _tmp.json src-tauri/tauri.conf.json

      # ── Node + Rust toolchain (mirrors ci.yml) ────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      # dtolnay/rust-toolchain only appends ~/.cargo/bin to PATH when it
      # bootstraps rustup itself; on pre-imaged runners `cargo` resolves
      # to the rustup shim instead. Add it explicitly (mirrors ci.yml).
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build Tauri app
        run: npm run tauri build
        # TODO(#10): add updater bundle signature step here using the
        # private key from CI secrets once tauri-plugin-updater is wired up.

      # ── Tag + Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.TAG }}" \
            --title "Beet ${{ steps.version.outputs.VERSION }}" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            src-tauri/target/release/bundle/dmg/*.dmg
