name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which semver component to bump"
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write   # required to create releases, push tags, and commit version bump

    steps:
      - uses: actions/checkout@v4
        # Need write access to push the version bump commit back to main.
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Bump version from tauri.conf.json ─────────────────────────────
      - name: Compute next version
        id: version
        run: |
          CURRENT=$(jq -r '.version' src-tauri/tauri.conf.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "Bumping ${CURRENT} → ${VERSION} (${{ inputs.bump }})"

      # ── Patch tauri.conf.json ─────────────────────────────────────────
      - name: Patch version in tauri.conf.json
        run: |
          jq --arg v "${{ steps.version.outputs.VERSION }}" \
             '.version = $v' src-tauri/tauri.conf.json > _tmp.json
          mv _tmp.json src-tauri/tauri.conf.json

      # ── Node + Rust toolchain (mirrors ci.yml) ────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      # dtolnay/rust-toolchain only appends ~/.cargo/bin to PATH when it
      # bootstraps rustup itself; on pre-imaged runners `cargo` resolves
      # to the rustup shim instead. Add it explicitly (mirrors ci.yml).
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build Tauri app
        run: npm run tauri build
        # TODO(#10): add updater bundle signature step here using the
        # private key from CI secrets once tauri-plugin-updater is wired up.

      # ── Commit the version bump back to main ──────────────────────────
      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json
          git commit -m "chore(release): ${{ steps.version.outputs.TAG }}"
          git push origin HEAD:${{ github.ref_name }}

      # ── Tag + Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.TAG }}" \
            --title "Beet ${{ steps.version.outputs.VERSION }}" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            src-tauri/target/release/bundle/dmg/*.dmg
